name: Build Exe

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow pywebview pyinstaller

      - name: Create Executable
        run: |
          pyinstaller `
            --noconsole `
            --onefile `
            --name "VibePhotoRenamer" `
            --add-data "ui.html;." `
            photo_organizer.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Photo-Renamer-Exe
          path: dist/VibePhotoRenamer.exe
